version: '3.7'

services:
    db:
      container_name: postgres
      image: docker.io/library/postgres:18.3
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      ports:
        - 5433:5432
      volumes:
        - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: